name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test imports
        run: |
          python -c "from app.gui.main_window import MainApp; import ortools, yaml, PySide6; print('smoke OK')"

      - name: Build exe
        run: pyinstaller schedule.spec

      - name: Zip output
        run: Compress-Archive -Path dist\schedule\* -DestinationPath schedule-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: schedule-windows
          path: schedule-windows.zip

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: schedule-windows.zip
